<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✈️ Anime Paberlennuki Klassifitseerija ~Kawaii~</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255,192,203,0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255,182,193,0.3) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(255,218,185,0.3) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .sakura-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .sakura {
            position: absolute;
            font-size: 20px;
            animation: fall linear infinite;
            opacity: 0.6;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10%) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255,255,255,0.9);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(255,105,180,0.3);
            overflow: hidden;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,182,193,0.5);
        }

        .header {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #ffd1ff 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 50%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .mascot {
            font-size: 80px;
            animation: bounce 2s ease infinite;
            display: inline-block;
            filter: drop-shadow(0 10px 20px rgba(255,105,180,0.5));
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .header h1 {
            font-size: 3em;
            margin: 10px 0;
            text-shadow: 3px 3px 6px rgba(255,105,180,0.5);
            font-weight: 800;
            letter-spacing: 2px;
        }

        .header .subtitle {
            font-size: 1.3em;
            opacity: 0.95;
            font-weight: 600;
        }

        .magical-sparkles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .sparkle {
            position: absolute;
            animation: sparkle 1.5s ease infinite;
            font-size: 20px;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }

        .main-content {
            padding: 30px;
            position: relative;
        }

        .character-corner {
            position: fixed;
            font-size: 100px;
            z-index: 3;
            animation: float 3s ease infinite;
            pointer-events: none;
        }

        .character-left {
            bottom: 20px;
            left: 20px;
        }

        .character-right {
            bottom: 20px;
            right: 20px;
            animation-delay: 1.5s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-30px) rotate(5deg); }
        }

        .upload-section {
            border: 3px dashed #ffb6c1;
            border-radius: 25px;
            padding: 50px;
            text-align: center;
            background: linear-gradient(135deg, rgba(255,245,248,0.8), rgba(255,240,245,0.8));
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .upload-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,182,193,0.1) 0%, transparent 50%);
            animation: rotate 15s linear infinite;
        }

        .upload-section:hover {
            background: rgba(255,230,240,0.9);
            border-color: #ff69b4;
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(255,105,180,0.3);
        }

        .upload-section.dragover {
            background: rgba(255,200,220,0.9);
            border-color: #ff1493;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 5em;
            margin-bottom: 20px;
            animation: bounce 2s ease infinite;
        }

        .btn {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(255,105,180,0.3);
            position: relative;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255,105,180,0.5);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: rotate(45deg);
            animation: shine 2s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .btn-secondary {
            background: linear-gradient(135deg, #ffd1ff 0%, #fecfef 100%);
        }

        .btn-camera {
            background: linear-gradient(135deg, #ffb6c1 0%, #ff69b4 100%);
        }

        .preview-section {
            display: none;
            margin-top: 30px;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from { 
                opacity: 0; 
                transform: translateY(30px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        .preview-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
        }

        .image-preview {
            background: linear-gradient(135deg, #fff5f8, #fff0f5);
            border-radius: 25px;
            padding: 25px;
            text-align: center;
            border: 2px solid #ffb6c1;
            position: relative;
            overflow: hidden;
        }

        .image-preview::before {
            content: '🌸';
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 30px;
            animation: float 3s ease infinite;
        }

        .image-preview::after {
            content: '✨';
            position: absolute;
            bottom: 10px;
            right: 10px;
            font-size: 30px;
            animation: float 3s ease infinite 1.5s;
        }

        .image-preview img, .image-preview video {
            max-width: 100%;
            max-height: 400px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(255,105,180,0.2);
            border: 3px solid #ffb6c1;
        }

        .analysis-results {
            background: linear-gradient(135deg, #fff5f8, #fff0f5);
            border-radius: 25px;
            padding: 30px;
            border: 2px solid #ffb6c1;
        }

        .step {
            margin-bottom: 25px;
            padding: 20px;
            border-radius: 20px;
            background: white;
            border-left: 6px solid #ffb6c1;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .step::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255,182,193,0.05), transparent);
            pointer-events: none;
        }

        .step.active {
            border-left-color: #4CAF50;
            background: linear-gradient(135deg, #f0fff0, #f5fff5);
            animation: pulse 2s ease infinite;
        }

        .step.error {
            border-left-color: #ff69b4;
            background: linear-gradient(135deg, #fff0f5, #fff5f8);
        }

        .step.processing {
            border-left-color: #ffb6c1;
            background: linear-gradient(135deg, #fff5f8, #fffaf0);
            animation: pulse 0.5s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.01); }
        }

        .step-title {
            font-weight: 800;
            font-size: 1.3em;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ff69b4;
        }

        .status-icon {
            font-size: 1.8em;
        }

        .confidence-bar {
            width: 100%;
            height: 12px;
            background: #ffe4e1;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
            border: 1px solid #ffb6c1;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff69b4, #ff1493, #ff69b4);
            transition: width 0.8s ease;
            border-radius: 10px;
            animation: gradient 2s ease infinite;
            background-size: 200% 100%;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .instruction-section {
            display: none;
            margin-top: 30px;
            background: linear-gradient(135deg, #fff5f8, #fff0f5);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(255,105,180,0.2);
            animation: fadeInUp 0.6s ease;
            border: 2px solid #ffb6c1;
        }

        .instruction-steps {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin: 25px 0;
        }

        .instruction-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            transition: all 0.3s ease;
            border: 2px solid #ffb6c1;
            position: relative;
            overflow: hidden;
        }

        .instruction-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(255,105,180,0.3);
            border-color: #ff69b4;
        }

        .step-number {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-weight: 800;
            font-size: 1.3em;
            box-shadow: 0 5px 15px rgba(255,105,180,0.3);
        }

        .video-link {
            display: inline-block;
            background: linear-gradient(135deg, #ff0000, #cc0000);
            color: white;
            padding: 15px 35px;
            border-radius: 50px;
            text-decoration: none;
            margin: 10px;
            transition: all 0.3s ease;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(255,0,0,0.3);
        }

        .video-link:hover {
            background: linear-gradient(135deg, #cc0000, #990000);
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255,0,0,0.5);
        }

        .error-message {
            background: linear-gradient(135deg, #fff0f5, #ffe4e1);
            border: 2px solid #ff69b4;
            color: #c2185b;
            padding: 25px;
            border-radius: 20px;
            margin: 20px 0;
            font-size: 1.1em;
            animation: shake 0.6s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-15px); }
            75% { transform: translateX(15px); }
        }

        .success-message {
            background: linear-gradient(135deg, #f0fff0, #f5fff5);
            border: 2px solid #4CAF50;
            color: #2e7d32;
            padding: 25px;
            border-radius: 20px;
            margin: 20px 0;
            font-size: 1.1em;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }

        .loading-anime {
            font-size: 80px;
            animation: spin 1s linear infinite, bounce 2s ease infinite;
            display: inline-block;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .test-images {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .test-image-btn {
            background: white;
            border: 2px solid #ffb6c1;
            color: #ff69b4;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
            font-weight: 600;
            font-family: 'Nunito', sans-serif;
        }

        .test-image-btn:hover {
            background: linear-gradient(135deg, #ffb6c1, #ff69b4);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255,105,180,0.3);
        }

        .camera-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .camera-container video {
            max-width: 90%;
            max-height: 70%;
            border-radius: 20px;
            border: 3px solid #ffb6c1;
        }

        .camera-controls {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }

        .moe-message {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 15px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255,105,180,0.3);
            z-index: 4;
            animation: slideIn 0.5s ease;
            border: 2px solid #ffb6c1;
            font-weight: 600;
            color: #ff69b4;
        }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 768px) {
            .preview-container {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .instruction-steps {
                grid-template-columns: 1fr;
            }

            .character-corner {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <!-- Sakura langevad õied -->
    <div class="sakura-particles" id="sakuraParticles"></div>

    <!-- Anime karakterid nurkades -->
    <div class="character-corner character-left">🎀</div>
    <div class="character-corner character-right">🌸</div>

    <div class="container">
        <div class="header">
            <div class="magical-sparkles" id="magicalSparkles"></div>
            <div class="mascot">✈️</div>
            <h1>✨ Kawaii Paberlennuki Klassifitseerija ✨</h1>
            <p class="subtitle">~ AI-magical girl analüüsib sinu paberlennukeid ~</p>
        </div>
        
        <div class="main-content">
            <!-- Üleslaadimise sektsioon -->
            <div class="upload-section" id="uploadSection">
                <div class="upload-icon">🌟</div>
                <h2>📸 Laadi oma pilt üles siia!</h2>
                <p style="color: #ff69b4; margin: 15px 0;">~ Või tee kiire foto oma meistriteosest ~</p>
                <input type="file" id="fileInput" accept="image/*" style="display: none;" capture="environment">
                <button class="btn" onclick="document.getElementById('fileInput').click()">
                    📁 Vali pilt
                </button>
                <button class="btn btn-camera" onclick="openCamera()">
                    📸 Tee foto
                </button>
                <button class="btn btn-secondary" onclick="testWithURL()">
                    🔗 Sisesta URL
                </button>
            </div>

            <!-- Testpiltide nupud -->
            <div class="test-images">
                <button class="test-image-btn" onclick="testKnownImage('purilennuk')">
                    🛩️ Testi Purilennukit
                </button>
                <button class="test-image-btn" onclick="testKnownImage('paberlennuk')">
                    📄 Testi Klassikalist
                </button>
                <button class="test-image-btn" onclick="testKnownImage('boeng737')">
                    ✈️ Testi Boeingut
                </button>
                <button class="test-image-btn" onclick="testRandomImage()">
                    🎲 Juhuslik test
                </button>
            </div>

            <!-- Laadimise indikaator -->
            <div class="loading" id="loadingIndicator">
                <div class="loading-anime">🌸</div>
                <p style="color: #ff69b4; font-weight: 600; margin-top: 15px;">
                    ~ AI-chan analüüsib pilti... ~
                </p>
            </div>

            <!-- Eelvaate ja tulemuste sektsioon -->
            <div class="preview-section" id="previewSection">
                <div class="preview-container">
                    <div class="image-preview">
                        <h3 style="color: #ff69b4;">📷 Sinu pilt:</h3>
                        <img id="previewImage" src="" alt="Preview">
                    </div>
                    
                    <div class="analysis-results">
                        <h3 style="color: #ff69b4;">🔍 AI-chan analüüs:</h3>
                        <div id="analysisSteps"></div>
                    </div>
                </div>
            </div>

            <!-- Juhendamise sektsioon -->
            <div class="instruction-section" id="instructionSection">
                <h2 style="color: #ff69b4;">📋 Kokkuvoltimise juhised</h2>
                <div id="instructionContent"></div>
            </div>

            <!-- URL sisestamise dialoog -->
            <div id="urlDialog" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 25px; box-shadow: 0 20px 60px rgba(255,105,180,0.4); z-index: 1000; border: 2px solid #ffb6c1;">
                <h3 style="color: #ff69b4;">🌟 Sisesta pildi URL:</h3>
                <input type="text" id="urlInput" placeholder="https://..." style="width: 100%; padding: 12px; margin: 15px 0; border: 2px solid #ffb6c1; border-radius: 15px; font-family: 'Nunito', sans-serif;">
                <br>
                <button class="btn" onclick="analyzeURL()">Analüüsi!</button>
                <button class="btn btn-secondary" onclick="document.getElementById('urlDialog').style.display='none'">Tühista</button>
            </div>
        </div>
    </div>

    <!-- Kaamera konteiner -->
    <div class="camera-container" id="cameraContainer">
        <video id="cameraVideo" autoplay playsinline></video>
        <div class="camera-controls">
            <button class="btn btn-camera" onclick="capturePhoto()">📸 Pildista!</button>
            <button class="btn btn-secondary" onclick="closeCamera()">❌ Sulge</button>
        </div>
    </div>

    <script>
        // Paberlennuki tüüpide andmebaas
        const paperAirplaneDatabase = {
            'purilennuk': {
                type: 'Purilennuk',
                difficulty: '★★★☆☆',
                flightCharacteristics: 'Pikk ja stabiilne lend nagu õrn tuuleke',
                instructions: [
                    { step: 1, text: 'Voldi paber pooleks pikuti ja ava tagasi', icon: '📄' },
                    { step: 2, text: 'Voldi ülemised nurgad keskjoonele', icon: '📐' },
                    { step: 3, text: 'Voldi tipud uuesti keskjoonele', icon: '✂️' },
                    { step: 4, text: 'Voldi nina alla, jättes 2cm varu', icon: '📏' },
                    { step: 5, text: 'Voldi tiivad alla, jättes 1cm põhja', icon: '🛩️' },
                    { step: 6, text: 'Painuta tiivaotsad üles stabilisaatoriteks', icon: '✨' }
                ],
                videoUrl: 'https://www.youtube.com/results?search_query=paper+glider+airplane+kawaii+tutorial',
                tips: 'Viska õrnalt nagu hõljuv sakura õis! Sobib ideaalselt sisetingimustes lendamiseks.'
            },
            'paberlennuk': {
                type: 'Klassikaline nool',
                difficulty: '★★☆☆☆',
                flightCharacteristics: 'Kiire ja sirge lend nagu ninja visatud shuriken',
                instructions: [
                    { step: 1, text: 'Voldi paber pooleks pikuti', icon: '📄' },
                    { step: 2, text: 'Voldi nurgad keskele', icon: '📐' },
                    { step: 3, text: 'Voldi uuesti nurgad keskele', icon: '✂️' },
                    { step: 4, text: 'Voldi pooleks tagurpidi', icon: '🔄' },
                    { step: 5, text: 'Voldi tiivad alla', icon: '🛩️' }
                ],
                videoUrl: 'https://www.youtube.com/results?search_query=classic+paper+airplane+dart+kawaii+tutorial',
                tips: 'Viska tugevalt ja otse nagu shoujo anime peategelane! Parim tulemus 45-kraadise nurga all.'
            },
            'stunt_plane': {
                type: 'Triklennuk',
                difficulty: '★★★★☆',
                flightCharacteristics: 'Akrobaatilised trikid nagu maagiline tüdruk',
                instructions: [
                    { step: 1, text: 'Voldi paber pooleks risti', icon: '📄' },
                    { step: 2, text: 'Voldi nurgad keskele, jäta vahe', icon: '📐' },
                    { step: 3, text: 'Voldi tiivad erineva nurga all', icon: '✂️' },
                    { step: 4, text: 'Tee tagatiibadesse lõiked', icon: '🔧' },
                    { step: 5, text: 'Seadista elevonid', icon: '⚙️' }
                ],
                videoUrl: 'https://www.youtube.com/results?search_query=stunt+paper+airplane+kawaii+tutorial',
                tips: 'Viska erinevate nurkade alt! Triklennuk sobib kogenud lendajatele nagu veteran maagiline tüdruk!'
            }
        };

        // Humoorikad anime-stiilis veateated
        const humorousErrors = {
            notAircraft: [
                "🌟 AI-chan ütleb: 'Nyaa~ See pole lennuk! See on {object}! Lennukid on aerodünaamilisemad, baka!'",
                "😸 'Kawaii kass, aga kassid ei ole lennukid! Proovi uuesti, onegai~'",
                "🌸 'Ilus lill! Aga lillede lennuomadused on... noh, mitte olemasolevad, desu~'",
                "🐕 'Auh! Koerad lendavad ainult unenägudes ja Studio Ghibli filmides!'",
                "🍕 'Pitsa on oishii, aga lendab ainult otse kõhtu! Tee paberlennuk, mitte pizza!'"
            ],
            realAircraft: [
                "✈️ 'Uwaa! See {type} on liiga suur! Meie kawaii klassifitseerija tegeleb ainult paberist lennukitega!'",
                "🛩️ 'AI-chan ütleb: See {type} vajab pilooti ja kütust! Paberist piisab ainult viskest, desu~'",
                "🚀 'Sugoi! Aga liiga palju metalli! Proovi midagi, mis mahub A4 formaati, onegai!'",
                "👨‍✈️ 'Gomen nasai! {type} jaoks on vaja lennujuhtimistorni, mitte voltimisoskusi!'"
            ]
        };

        // Täiustatud simulatsioon koos AI-loogikaga
        function simulateClassification(imageData) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    let result = {
                        step1: { passed: false, confidence: 0, details: '' },
                        step2: { passed: false, confidence: 0, details: '' },
                        step3: { passed: false, type: null, details: '' }
                    };

                    const url = imageData.toLowerCase();
                    
                    // Detailne kontroll erinevate objektide jaoks
                    if (url.includes('purilennuk') || url.includes('glider')) {
                        result.step1 = { 
                            passed: true, 
                            confidence: 0.95, 
                            details: '🌟 AI-chan tuvastas lennukitaolise objekti! Sugoi!' 
                        };
                        result.step2 = { 
                            passed: true, 
                            confidence: 0.89, 
                            details: '✨ Kawaii! Materjal tuvastatud paberina - tegemist on paberlennukiga!' 
                        };
                        result.step3 = { 
                            passed: true, 
                            type: 'purilennuk', 
                            details: '🎯 AI-chan on kindel: See on Purilennuk! Laiad tiivad ja elegantne disain!' 
                        };
                    } else if (url.includes('paberlennuk') || url.includes('paper_airplane') || url.includes('dart')) {
                        result.step1 = { 
                            passed: true, 
                            confidence: 0.98, 
                            details: '🌟 AI-chan näeb lennukit! Dokidoki~' 
                        };
                        result.step2 = { 
                            passed: true, 
                            confidence: 0.95, 
                            details: '✨ Selged voldid tuvastatud! See on kindlasti paberlennuk!' 
                        };
                        result.step3 = { 
                            passed: true, 
                            type: 'paberlennuk', 
                            details: '🎯 AI-chan tuvastas: Klassikaline nool! Terav nina ja kolmnurksed tiivad - natsukashii~' 
                        };
                    } else if (url.includes('boeng') || url.includes('737') || url.includes('airliner') || url.includes('airbus')) {
                        result.step1 = { 
                            passed: true, 
                            confidence: 0.99, 
                            details: '🌟 Tuvastatud suur lennuk! Massugu!' 
                        };
                        result.step2 = { 
                            passed: false, 
                            confidence: 0.01, 
                            details: '❌ AI-chan näeb päris lennukit! See on Boeing 737 - liiga professionaalne!' 
                        };
                        result.step3 = { 
                            passed: false, 
                            type: null, 
                            details: 'Analüüs peatatud - tegemist pole paberlennukiga, gomen ne~' 
                        };
                    } else if (url.includes('fighter') || url.includes('military') || url.includes('jet')) {
                        result.step1 = { 
                            passed: true, 
                            confidence: 0.97, 
                            details: '🌟 Tuvastatud sõjalennuk! Kakkoi!' 
                        };
                        result.step2 = { 
                            passed: false, 
                            confidence: 0.02, 
                            details: '❌ AI-chan ütleb: Hävitaja on liiga võimas! Paberist versioon oleks armsam~' 
                        };
                    } else {
                        // Juhuslikud objektid testimiseks
                        const objects = ['õun', 'kass', 'koer', 'lill', 'auto', 'tool', 'raamat'];
                        const randomObj = objects[Math.floor(Math.random() * objects.length)];
                        
                        result.step1 = { 
                            passed: false, 
                            confidence: 0.1, 
                            details: `❌ AI-chan näeb ${randomObj} - see pole lennuk! Mochiron!` 
                        };
                    }

                    resolve(result);
                }, 2000);
            });
        }

        function displayResults(result) {
            const stepsContainer = document.getElementById('analysisSteps');
            let html = '';

            // Samm 1
            html += `
                <div class="step ${result.step1.passed ? 'active' : 'error'}">
                    <div class="step-title">
                        <span>🌟 Samm 1: Lennuki tuvastamine</span>
                        <span class="status-icon">${result.step1.passed ? '✅' : '❌'}</span>
                    </div>
                    <p style="color: #666;">${result.step1.details}</p>
                    <div class="confidence-bar">
                        <div class="confidence-fill" style="width: ${result.step1.confidence * 100}%"></div>
                    </div>
                    <small style="color: #ff69b4;">Kindlus: ${(result.step1.confidence * 100).toFixed(1)}%</small>
                </div>
            `;

            if (!result.step1.passed) {
                const errorMsg = humorousErrors.notAircraft[Math.floor(Math.random() * humorousErrors.notAircraft.length)];
                html += `<div class="error-message">${errorMsg.replace('{object}', result.step1.details.split(' ').pop() || 'tundmatu objekt')}</div>`;
                stepsContainer.innerHTML = html;
                return false;
            }

            // Samm 2
            html += `
                <div class="step ${result.step2.passed ? 'active' : 'error'}">
                    <div class="step-title">
                        <span>✨ Samm 2: Paberlennuki kinnitus</span>
                        <span class="status-icon">${result.step2.passed ? '✅' : '❌'}</span>
                    </div>
                    <p style="color: #666;">${result.step2.details}</p>
                    <div class="confidence-bar">
                        <div class="confidence-fill" style="width: ${result.step2.confidence * 100}%"></div>
                    </div>
                    <small style="color: #ff69b4;">Kindlus: ${(result.step2.confidence * 100).toFixed(1)}%</small>
                </div>
            `;

            if (!result.step2.passed) {
                const realTypes = ['Boeing 737', 'Airbus A320', 'F-16 hävitaja', 'Cessna väikelennuk'];
                const realType = realTypes[Math.floor(Math.random() * realTypes.length)];
                const errorMsg = humorousErrors.realAircraft[Math.floor(Math.random() * humorousErrors.realAircraft.length)];
                html += `<div class="error-message">${errorMsg.replace('{type}', realType)}</div>`;
                stepsContainer.innerHTML = html;
                return false;
            }

            // Samm 3
            html += `
                <div class="step active">
                    <div class="step-title">
                        <span>🎯 Samm 3: Tüübi tuvastamine</span>
                        <span class="status-icon">✅</span>
                    </div>
                    <p style="color: #666;">${result.step3.details}</p>
                    <div class="success-message">
                        🌸 Omedetou! AI-chan tuvastas: <strong>${getPlaneTypeName(result.step3.type)}</strong>
                    </div>
                </div>
            `;

            stepsContainer.innerHTML = html;
            displayInstructions(result.step3.type);
            
            // Näita Moe sõnumit
            showMoeMessage('🌸 AI-chan on rõõmus! Edukas tuvastamine! Sugoi~!');
            
            return true;
        }

        function getPlaneTypeName(type) {
            const names = {
                'purilennuk': 'Purilennuk 🛩️',
                'paberlennuk': 'Klassikaline nool 📄',
                'stunt_plane': 'Triklennuk 🎯'
            };
            return names[type] || type;
        }

        function displayInstructions(planeType) {
            const instructionSection = document.getElementById('instructionSection');
            const instructionContent = document.getElementById('instructionContent');
            
            if (!planeType || !paperAirplaneDatabase[planeType]) {
                const defaultData = paperAirplaneDatabase['paberlennuk'];
                renderInstructions(defaultData, instructionSection, instructionContent);
                return;
            }
            
            renderInstructions(paperAirplaneDatabase[planeType], instructionSection, instructionContent);
        }

        function renderInstructions(data, section, content) {
            let html = `
                <div style="margin-bottom: 25px; background: white; padding: 20px; border-radius: 15px;">
                    <p><strong>🌟 Tüüp:</strong> ${data.type}</p>
                    <p><strong>⭐ Raskusaste:</strong> ${data.difficulty}</p>
                    <p><strong>💫 Lennuomadused:</strong> ${data.flightCharacteristics}</p>
                </div>
                
                <h3>📝 Samm-sammuline juhend:</h3>
                <div class="instruction-steps">
            `;
            
            data.instructions.forEach(instruction => {
                html += `
                    <div class="instruction-card">
                        <div class="step-number">${instruction.step}</div>
                        <div style="font-size: 2.5em;">${instruction.icon}</div>
                        <p style="color: #666; font-weight: 600;">${instruction.text}</p>
                    </div>
                `;
            });
            
            html += `
                </div>
                <div style="text-align: center; margin: 25px 0;">
                    <a href="${data.videoUrl}" target="_blank" class="video-link">
                        📹 Otsi videojuhendit YouTube'ist
                    </a>
                </div>
                <div style="background: linear-gradient(135deg, #fff9c4, #ffe0b2); padding: 20px; border-radius: 15px; margin-top: 20px; border: 2px solid #ffb6c1;">
                    <strong>💡 Kawaii nipp:</strong> ${data.tips}
                </div>
            `;
            
            content.innerHTML = html;
            section.style.display = 'block';
            section.scrollIntoView({ behavior: 'smooth' });
        }

        function showMoeMessage(message) {
            const existingMsg = document.querySelector('.moe-message');
            if (existingMsg) existingMsg.remove();
            
            const msg = document.createElement('div');
            msg.className = 'moe-message';
            msg.textContent = message;
            document.body.appendChild(msg);
            
            setTimeout(() => msg.remove(), 3000);
        }

        // Pildi üleslaadimise ja analüüsi funktsioonid
        function handleImageUpload(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                displayImageAndAnalyze(e.target.result);
            };
            reader.readAsDataURL(file);
        }

        async function displayImageAndAnalyze(imageSource) {
            const previewSection = document.getElementById('previewSection');
            const previewImage = document.getElementById('previewImage');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const instructionSection = document.getElementById('instructionSection');
            
            previewImage.src = imageSource;
            previewSection.style.display = 'block';
            instructionSection.style.display = 'none';
            loadingIndicator.style.display = 'block';
            
            previewSection.scrollIntoView({ behavior: 'smooth' });
            
            try {
                const result = await simulateClassification(imageSource);
                loadingIndicator.style.display = 'none';
                displayResults(result);
            } catch (error) {
                loadingIndicator.style.display = 'none';
                const stepsContainer = document.getElementById('analysisSteps');
                stepsContainer.innerHTML = `
                    <div class="error-message">
                        ❌ Gomen nasai! Viga analüüsimisel: ${error.message}<br>
                        <small>~ Palun proovi uuesti, onegai! ~</small>
                    </div>
                `;
            }
        }

        function testKnownImage(type) {
            const urls = {
                'purilennuk': 'https://cyberplanet.tech/tthk/agile/pics/purilennuk.jpg',
                'paberlennuk': 'https://cyberplanet.tech/tthk/agile/pics/paberlennuk.jpg',
                'boeng737': 'https://cyberplanet.tech/tthk/agile/pics/boeng737.jpg'
            };
            
            const url = urls[type];
            if (url) {
                displayImageAndAnalyze(url);
                showMoeMessage(`🌟 Testin ${type === 'boeng737' ? 'Boeingut' : type}... Ganbatte!`);
            }
        }

        function testRandomImage() {
            const randomObjects = [
                { url: 'https://cyberplanet.tech/tthk/agile/pics/purilennuk.jpg', name: 'Purilennuk' },
                { url: 'https://cyberplanet.tech/tthk/agile/pics/paberlennuk.jpg', name: 'Klassikaline' },
                { url: 'https://cyberplanet.tech/tthk/agile/pics/boeng737.jpg', name: 'Boeing 737' }
            ];
            
            const random = randomObjects[Math.floor(Math.random() * randomObjects.length)];
            displayImageAndAnalyze(random.url);
            showMoeMessage('🎲 Juhuslik test! Nani ga deru kana?');
        }

        function testWithURL() {
            const dialog = document.getElementById('urlDialog');
            dialog.style.display = 'block';
        }

        function analyzeURL() {
            const url = document.getElementById('urlInput').value;
            if (url) {
                document.getElementById('urlDialog').style.display = 'none';
                displayImageAndAnalyze(url);
                showMoeMessage('🔗 Analüüsin URL-i... Wakuwaku!');
            }
        }

        // Kaamera funktsioonid
        async function openCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    } 
                });
                
                const video = document.getElementById('cameraVideo');
                video.srcObject = stream;
                
                document.getElementById('cameraContainer').style.display = 'flex';
                showMoeMessage('📸 Kaamera avatud! Tee pilt oma paberlennukist!');
            } catch (error) {
                alert('Gomen! Kaamera avamine ebaõnnestus: ' + error.message);
            }
        }

        function closeCamera() {
            const video = document.getElementById('cameraVideo');
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            document.getElementById('cameraContainer').style.display = 'none';
        }

        function capturePhoto() {
            const video = document.getElementById('cameraVideo');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            
            const imageData = canvas.toDataURL('image/jpeg', 0.9);
            closeCamera();
            displayImageAndAnalyze(imageData);
            showMoeMessage('✨ Pilt tehtud! AI-chan hakkab analüüsima~');
        }

        // Sakura osakeste loomine
        function createSakuraParticles() {
            const container = document.getElementById('sakuraParticles');
            const sakuraEmojis = ['🌸', '💮', '🌺', '✿', '❀', '🌷'];
            
            setInterval(() => {
                const sakura = document.createElement('div');
                sakura.className = 'sakura';
                sakura.textContent = sakuraEmojis[Math.floor(Math.random() * sakuraEmojis.length)];
                sakura.style.left = Math.random() * 100 + '%';
                sakura.style.fontSize = (Math.random() * 15 + 15) + 'px';
                sakura.style.animationDuration = (Math.random() * 5 + 5) + 's';
                sakura.style.animationDelay = Math.random() * 3 + 's';
                
                container.appendChild(sakura);
                
                setTimeout(() => sakura.remove(), 8000);
            }, 500);
        }

        // Maagiliste sädeluste loomine
        function createSparkles() {
            const container = document.getElementById('magicalSparkles');
            const sparkleEmojis = ['✨', '⭐', '💫', '🌟', '✨'];
            
            for (let i = 0; i < 10; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.textContent = sparkleEmojis[Math.floor(Math.random() * sparkleEmojis.length)];
                sparkle.style.left = Math.random() * 100 + '%';
                sparkle.style.top = Math.random() * 100 + '%';
                sparkle.style.animationDelay = Math.random() * 2 + 's';
                sparkle.style.animationDuration = (Math.random() * 1 + 1) + 's';
                
                container.appendChild(sparkle);
            }
        }

        // Sündmuste kuularid
        document.addEventListener('DOMContentLoaded', function() {
            createSakuraParticles();
            createSparkles();
            
            const uploadSection = document.getElementById('uploadSection');
            const fileInput = document.getElementById('fileInput');
            
            fileInput.addEventListener('change', function(e) {
                if (e.target.files.length > 0) {
                    handleImageUpload(e.target.files[0]);
                    showMoeMessage('📁 Pilt valitud! AI-chan asub tööle~');
                }
            });
            
            uploadSection.addEventListener('dragover', function(e) {
                e.preventDefault();
                this.classList.add('dragover');
            });
            
            uploadSection.addEventListener('dragleave', function(e) {
                e.preventDefault();
                this.classList.remove('dragover');
            });
            
            uploadSection.addEventListener('drop', function(e) {
                e.preventDefault();
                this.classList.remove('dragover');
                
                if (e.dataTransfer.files.length > 0) {
                    handleImageUpload(e.dataTransfer.files[0]);
                    showMoeMessage('🌟 Pilt lohistatud! Sugoi!');
                }
            });
            
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    document.getElementById('urlDialog').style.display = 'none';
                    if (document.getElementById('cameraContainer').style.display === 'flex') {
                        closeCamera();
                    }
                }
            });
            
            document.getElementById('urlInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    analyzeURL();
                }
            });
        });

        // Konsooli tervitus
        console.log('🌸✨ Kawaii Paberlennuki Klassifitseerija ✨🌸');
        console.log('AI-chan on valmis analüüsima sinu paberlennukeid!');
        console.log('Ganbatte ne! ~☆');
    </script>
</body>
